name: Release

# Tag-triggered publish. Pushing a `v*` tag (e.g. v0.1.0) on main re-runs the
# full CI gate (typecheck/lint/unit/build/e2e-a11y + carry-forward closed) and,
# only if green, builds + pushes the multi-arch image to GHCR.
#
# The release branch (release/v0.1.0) is NEVER deleted here — the user wants old
# release branches kept. There is no branch-cleanup step anywhere in this file.
#
# Ordering history, because it has changed twice and the difference matters:
#
#   through v0.2.12   gate → publish → merge → scan
#                     A finding arrived AFTER :latest already pointed at the new
#                     image. v0.2.12 shipped a vulnerable :latest exactly so.
#
#   v0.2.13/v0.2.14   gate → publish → scan → merge
#                     A finding blocked the TAGS, but publish had already pushed
#                     untagged per-arch digests, so a failed scan left orphans in
#                     the registry.
#
#   v0.2.15 (now)     gate → [build → scan → push] per arch → merge
#                     Nothing reaches the registry until the scan passes. The
#                     scan also runs per-arch instead of once on amd64, so the
#                     arm64 image is covered for the first time.
on:
  push:
    tags:
      - 'v*'

jobs:
  # Re-run the identical PR/push gate (incl. the e2e+a11y 19-route axe harness and
  # the carry-forward-closed check) so the tag publish can never outrun the gate.
  gate:
    uses: ./.github/workflows/ci.yml

  # v0.2.12: SHARDED multi-arch publish. The old single job built arm64 under QEMU
  # emulation (~20 min wall). Now each arch builds NATIVELY in parallel — amd64 on
  # ubuntu-latest, arm64 on GitHub's free-for-public-repos arm runner — pushed
  # by-digest (no tags), and a tiny merge job stitches the digests into the tagged
  # multi-arch manifest list. Wall time ≈ the slower single arch + ~1 min.
  #
  # v0.2.15: each leg now BUILDS TO A LOCAL TAR, SCANS IT, and pushes only if the
  # scan passes. The push is a second build-push-action against the same gha cache
  # scope, so it is a cache hit rather than a rebuild.
  publish:
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write   # required to upload SARIF to GitHub Security tab
    steps:
      - uses: actions/checkout@v4

      # Native per-arch builds — no QEMU anywhere.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize platform for artifact/cache keys
        id: plat
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # ── Build LOCALLY first. Nothing is pushed here. ─────────────────────────
      # A tar (type=docker,dest=…) rather than `load: true` so Trivy can read it
      # with `--input` and needs no access to the docker daemon socket.
      # provenance/sbom are omitted deliberately: attestations are a push-time
      # concern and the docker exporter cannot carry them.
      - name: Build image to a local tar (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # CF2: stamp the image with the commit it was built from. version.ts
          # BUILD_SHA reads process.env.GIT_SHA → shown on the /whats-new About page.
          build-args: |
            GIT_SHA=${{ github.sha }}
          outputs: type=docker,dest=/tmp/image-${{ steps.plat.outputs.slug }}.tar
          # Per-arch cache scope — the two builds must not clobber each other's
          # cache. Written here; the push step below reads it back.
          cache-from: type=gha,scope=build-${{ steps.plat.outputs.slug }}
          cache-to: type=gha,mode=max,scope=build-${{ steps.plat.outputs.slug }}

      # SARIF for the Security tab — informational only, NEVER fails the job
      # (exit-code 0). This is the all-severity report.
      - name: Trivy — build SARIF report (all severities, non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image-${{ steps.plat.outputs.slug }}.tar
          format: sarif
          output: trivy-results-${{ steps.plat.outputs.slug }}.sarif
          ignore-unfixed: true
          exit-code: '0'          # informational; the gate is the next step

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()              # upload even if a later step fails
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ steps.plat.outputs.slug }}.sarif
          # Distinct category per arch, otherwise the second leg overwrites the
          # first one's results instead of adding to them.
          category: trivy-${{ steps.plat.outputs.slug }}

      # The actual GATE: run the Trivy CLI directly (NOT the action wrapper, which
      # in sarif mode ignores the severity filter for its exit code — it builds an
      # ALL-severity report and then lets `exit-code: 1` fire on any severity at
      # all, so a mere MEDIUM failed the release. That cost v0.2.0 through v0.2.5,
      # every one of which was red here for no real reason). Table format,
      # --severity HIGH,CRITICAL, --ignore-unfixed, --exit-code 1 → exits non-zero
      # ONLY on a FIXED HIGH/CRITICAL.
      #
      # v0.2.15: scans the LOCAL TAR, before anything is pushed. A failure here
      # means the registry never sees this build at all — not even an orphan
      # digest, which is what v0.2.13 left behind.
      - name: Trivy — fail on FIXED HIGH/CRITICAL (the gate)
        env:
          TAR: /tmp/image-${{ steps.plat.outputs.slug }}.tar
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}/.cache/trivy:/root/.cache/" \
            -v "$TAR:/image.tar:ro" \
            aquasec/trivy:0.72.0 image \
            --input /image.tar \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --scanners vuln \
            --format table \
            --exit-code 1

      # ── Only now does anything reach the registry. ───────────────────────────
      # Same context, same build-args, same cache scope → a cache hit, not a
      # rebuild. Pushed by digest and untagged; the merge job builds the tagged
      # manifest list from the two digests.
      - name: Push by digest (scan passed)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          outputs: type=image,name=ghcr.io/jonathanmcohen/parchment,push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=build-${{ steps.plat.outputs.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.plat.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into the tagged multi-arch manifest list
  # (ghcr.io/jonathanmcohen/parchment:vX.Y.Z + :latest).
  merge:
    # v0.2.15: back to needing `publish` directly, because the scan now lives
    # INSIDE publish and runs before its push. If either leg's scan fails, that
    # leg never pushes, fail-fast cancels the other, and merge never runs — so no
    # tags and no orphan digests.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jonathanmcohen/parchment
          # type=ref,event=tag yields the literal git tag (v0.1.0) so the published
          # image name matches the documented ghcr.io/jonathanmcohen/parchment:v0.1.0
          # (scope L1). Plus the moving :latest tag.
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create and push the multi-arch manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/jonathanmcohen/parchment@sha256:%s ' *)

      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "ghcr.io/jonathanmcohen/parchment:${{ steps.meta.outputs.version }}"
